<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title description">
  <title id="title">Participant screen screenshot placeholder</title>
  <desc id="description">A placeholder to be replaced with a screenshot of the Guess the Song participant screen.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#15312f"/>
      <stop offset="0.45" stop-color="#121417"/>
      <stop offset="1" stop-color="#302b1b"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#ffffff" stroke-opacity=".035"/>
    </pattern>
  </defs>
  <rect width="1280" height="720" rx="24" fill="url(#background)"/>
  <rect width="1280" height="720" rx="24" fill="url(#grid)"/>
  <rect x="48" y="48" width="1184" height="624" rx="20" fill="#1c2228" fill-opacity=".88" stroke="#3b444d" stroke-width="2"/>
  <circle cx="640" cy="290" r="112" fill="#101316" stroke="#30c6b3" stroke-width="14" stroke-dasharray="430 275"/>
  <text x="640" y="307" fill="#f5f2eb" font-family="Arial, sans-serif" font-size="72" font-weight="700" text-anchor="middle">5.0</text>
  <text x="640" y="350" fill="#aab2ba" font-family="Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle">SECONDS</text>
  <text x="640" y="482" fill="#f4c95d" font-family="Arial, sans-serif" font-size="52" font-weight="700" text-anchor="middle">PARTICIPANT SCREEN</text>
  <text x="640" y="530" fill="#aab2ba" font-family="Arial, sans-serif" font-size="24" text-anchor="middle">Replace this placeholder with your final screenshot</text>
  <rect x="450" y="568" width="380" height="52" rx="10" fill="#252c33" stroke="#3b444d"/>
  <text x="640" y="602" fill="#30c6b3" font-family="Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle">docs/images/participant-screen.png</text>
</svg>

