<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title description">
  <title id="title">Host controls screenshot placeholder</title>
  <desc id="description">A placeholder to be replaced with a screenshot of the Guess the Song host controls.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#15312f"/>
      <stop offset="0.45" stop-color="#121417"/>
      <stop offset="1" stop-color="#302b1b"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#ffffff" stroke-opacity=".035"/>
    </pattern>
  </defs>
  <rect width="1280" height="720" rx="24" fill="url(#background)"/>
  <rect width="1280" height="720" rx="24" fill="url(#grid)"/>
  <rect x="48" y="48" width="1184" height="624" rx="20" fill="#1c2228" fill-opacity=".88" stroke="#3b444d" stroke-width="2"/>
  <rect x="150" y="170" width="980" height="78" rx="12" fill="#101316" stroke="#6ea8fe" stroke-opacity=".7" stroke-width="2"/>
  <circle cx="194" cy="209" r="14" fill="none" stroke="#30c6b3" stroke-width="6"/>
  <path d="M204 219 222 237" stroke="#30c6b3" stroke-width="6" stroke-linecap="round"/>
  <text x="250" y="221" fill="#aab2ba" font-family="Arial, sans-serif" font-size="26">Search YouTube for a song...</text>
  <g fill="#252c33" stroke="#3b444d">
    <rect x="150" y="276" width="180" height="102" rx="10"/>
    <rect x="350" y="276" width="180" height="102" rx="10"/>
    <rect x="550" y="276" width="180" height="102" rx="10"/>
    <rect x="750" y="276" width="180" height="102" rx="10"/>
    <rect x="950" y="276" width="180" height="102" rx="10"/>
  </g>
  <text x="640" y="482" fill="#f4c95d" font-family="Arial, sans-serif" font-size="52" font-weight="700" text-anchor="middle">HOST CONTROLS</text>
  <text x="640" y="530" fill="#aab2ba" font-family="Arial, sans-serif" font-size="24" text-anchor="middle">Replace this placeholder with your final screenshot</text>
  <rect x="460" y="568" width="360" height="52" rx="10" fill="#252c33" stroke="#3b444d"/>
  <text x="640" y="602" fill="#30c6b3" font-family="Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle">docs/images/host-controls.png</text>
</svg>

